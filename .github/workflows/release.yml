name: Release veröffentlichen

# Jeder Push auf main veröffentlicht eine signierte APK als GitHub-Release.
# Release-Dateien sind ohne Login abrufbar – Actions-Artefakte nicht. Nur so
# kommt ein Update-Manager wie Obtainium überhaupt an die APK heran.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Secrets prüfen
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          fehlend=""
          [ -n "$KEYSTORE_BASE64" ]   || fehlend="$fehlend KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || fehlend="$fehlend KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ]         || fehlend="$fehlend KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ]      || fehlend="$fehlend KEY_PASSWORD"
          if [ -n "$fehlend" ]; then
            echo "::error::Fehlende Secrets:$fehlend – siehe README, Abschnitt 'Signaturschlüssel einrichten'."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Keystore auspacken
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"

      - name: assembleRelease
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Signatur prüfen
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          apksigner=$(find "$sdk/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner nicht gefunden – Signatur bleibt ungeprüft."
            exit 1
          fi
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: 1.0.${{ github.run_number }}
        run: |
          apk="$RUNNER_TEMP/Atemrunden-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          {
            echo "Signierte APK, versionCode ${{ github.run_number }}, Stand ${{ github.sha }}."
            echo
            echo "Zum Installieren die APK herunterladen und öffnen. Über eine vorher"
            echo "installierte Version aus diesen Releases läuft das Update direkt"
            echo "drüber, ohne Deinstallation und ohne Verlust der Einstellungen."
          } > "$RUNNER_TEMP/notes.md"
          # Bei einem erneuten Lauf existiert das Release schon: dann nur die Datei ersetzen.
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "$apk" --clobber
          else
            gh release create "v$VERSION" "$apk" \
              --title "Atemrunden $VERSION" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi

      - name: Keystore entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
