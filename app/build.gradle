plugins { id 'com.android.application' }

// Versionsnummer. Der Release-Workflow reicht die fortlaufende Nummer seines
// Laufs als VERSION_CODE herein, damit jede veröffentlichte APK garantiert
// höher zählt als die vorige und ein Updater "neuer" von "gleich" unterscheiden
// kann. Lokale Builds bleiben bei 1.
def appVersionCode = (System.getenv("VERSION_CODE") ?: "1").toInteger()
def appVersionName = "1.0.${appVersionCode}"

// Signierung. Der Schlüssel kommt aus Umgebungsvariablen, im CI aus den
// GitHub-Secrets; im Repo liegt er nie. Fehlt er, fällt der Release-Build auf
// den Debug-Schlüssel zurück, damit "./gradlew assembleRelease" auch ohne
// Keystore lokal durchläuft. Nur eine mit dem festen Schlüssel signierte APK
// lässt sich über eine vorhandene Installation aktualisieren.
def keystorePath = System.getenv("KEYSTORE_FILE")
def hasKeystore = keystorePath != null && !keystorePath.isEmpty() && file(keystorePath).exists()

android {
    namespace 'de.windstille'
    compileSdk 34

    defaultConfig {
        applicationId "de.windstille"
        minSdk 24
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName
    }

    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile file(keystorePath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { }

// Bricht den Build ab, statt eine mit dem Debug-Schlüssel signierte APK zu
// veröffentlichen: die liesse sich später nicht mehr durch ein Update ersetzen.
tasks.matching { it.name == "assembleRelease" }.configureEach {
    doFirst {
        if (!hasKeystore && System.getenv("CI") != null) {
            throw new GradleException(
                "Release-Build ohne Keystore: KEYSTORE_FILE zeigt auf keine vorhandene Datei.")
        }
    }
}
