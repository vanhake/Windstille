plugins { id 'com.android.application' }

android {
    namespace 'de.atemrunden'
    compileSdk 34

    defaultConfig {
        applicationId "de.atemrunden"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Ohne eigenen Schlüssel erzeugt "assembleDebug" eine sofort
            // installierbare APK. Für eine Release-APK hier signingConfig eintragen.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { }
